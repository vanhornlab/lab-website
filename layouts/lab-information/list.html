{{ define "main" }}
<div class="container py-5" style="max-width: 1080px;">
  
  <div class="d-flex justify-content-between align-items-center mb-5 pb-2" style="border-bottom: 1px solid rgba(255,255,255,0.15);">
    <h1 class="text-white font-weight-bold m-0" style="font-size: 2.5rem;">Lab Information</h1>
  </div>

  <div class="lab-info-body text-light" style="font-size: 1.05rem; line-height: 1.75;">
    <style>
      .lab-info-body h3 {
        color: #f3f4f6;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
      }
      .lab-info-body ul {
        padding-left: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .lab-info-body li {
        margin-bottom: 0.75rem;
      }
      .lab-info-body a {
        color: #60a5fa;
        text-decoration: none;
      }
      .lab-info-body a:hover {
        text-decoration: underline;
      }
    </style>
    {{ .Content }}
  </div>

</div>
{{ end }}
