{{ define "main" }}
<div class="container py-5" style="max-width: 1080px;">
  
  <!-- Header Row: Title + PubMed Button -->
  <div class="d-flex justify-content-between align-items-center mb-5 pb-2" style="border-bottom: 1px solid rgba(255,255,255,0.15);">
    <h1 class="text-white font-weight-bold m-0" style="font-size: 2.5rem;">Publications</h1>
    <a href="https://pubmed.ncbi.nlm.nih.gov/?term=Van+Horn+WD&sort=date&size=100" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-info" style="font-weight: 500;">
      View full list on PubMed &rarr;
    </a>
  </div>

  <!-- 4 Journal Covers Row -->
  <div class="row g-4 mb-5 justify-content-center text-center">
    <div class="col-6 col-md-3">
      <div class="p-2 rounded bg-dark border border-secondary shadow-sm h-100 d-flex align-items-center justify-content-center">
        <img src="/media/covers/cover-biochemistry.png" alt="Biochemistry Cover" class="img-fluid rounded" style="max-height: 220px; object-fit: contain;">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="p-2 rounded bg-dark border border-secondary shadow-sm h-100 d-flex align-items-center justify-content-center">
        <img src="/media/covers/cover-chembiochem.png" alt="ChemBioChem Cover" class="img-fluid rounded" style="max-height: 220px; object-fit: contain;">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="p-2 rounded bg-dark border border-secondary shadow-sm h-100 d-flex align-items-center justify-content-center">
        <img src="/media/covers/cover-matter.png" alt="Matter Cover" class="img-fluid rounded" style="max-height: 220px; object-fit: contain;">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="p-2 rounded bg-dark border border-secondary shadow-sm h-100 d-flex align-items-center justify-content-center">
        <img src="/media/covers/cover-temperature.png" alt="Temperature Cover" class="img-fluid rounded" style="max-height: 220px; object-fit: contain;">
      </div>
    </div>
  </div>

  <hr style="border-color: rgba(255,255,255,0.15); margin-bottom: 2.5rem;">

  <!-- Publication Entries with Reverse-Chronological Hanging Indent -->
  <div class="publications-body text-light" style="font-size: 1.05rem; line-height: 1.75;">
    <style>
      .publications-body p {
        margin-bottom: 1.6rem;
        padding-left: 2.4rem;
        text-indent: -2.4rem;
      }
      .publications-body a {
        color: #60a5fa;
        text-decoration: none;
      }
      .publications-body a:hover {
        text-decoration: underline;
      }
    </style>
    {{ .Content }}
  </div>

</div>
{{ end }}
